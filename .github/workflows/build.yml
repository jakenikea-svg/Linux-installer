name: Build Windows .exe

on:
  push:
    branches: [main]
  workflow_dispatch:  # Lets you trigger it manually

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install pyinstaller ttkbootstrap psutil requests Pillow

      - name: Build .exe
        run: |
          pyinstaller --name LinuxOSInstaller --onefile --noconfirm --clean --collect-all ttkbootstrap --hidden-import requests --hidden-import PIL --hidden-import src.core.disk_manager --hidden-import src.core.grub_installer --hidden-import src.core.iso_handler --hidden-import src.core.install_engine --hidden-import src.core.filesystem --hidden-import src.gui.wizard main.py

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: LinuxOSInstaller-exe
          path: dist\LinuxOSInstaller.exe
